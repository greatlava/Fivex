# Redis 配置 - Fivex 五子棋对战
bind 0.0.0.0
protected-mode no
port 6379

# 认证密码（生产环境请取消注释并修改）
# requirepass fivex123

# 最大内存限制
maxmemory 256mb
maxmemory-policy allkeys-lru

# AOF 持久化（保障断线重连后的游戏快照恢复）
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
dir /home/fivex/redis/data

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 连接超时（单位秒，0 表示不超时）
timeout 300
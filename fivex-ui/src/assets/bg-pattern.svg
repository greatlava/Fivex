<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <pattern id="boardGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#0a0e18"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="rgba(255,215,0,0.04)" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="rgba(255,215,0,0.04)" stroke-width="1"/>
    </pattern>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,140,0,0.06)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#boardGrid)"/>
  <rect width="400" height="400" fill="url(#centerGlow)"/>

  <!-- scattered decorative stones -->
  <circle cx="40" cy="40" r="3" fill="rgba(255,215,0,0.06)"/>
  <circle cx="120" cy="80" r="2" fill="rgba(255,255,255,0.04)"/>
  <circle cx="200" cy="40" r="3.5" fill="rgba(255,215,0,0.05)"/>
  <circle cx="320" cy="120" r="2.5" fill="rgba(255,255,255,0.04)"/>
  <circle cx="80" cy="200" r="3" fill="rgba(255,140,0,0.05)"/>
  <circle cx="360" cy="240" r="2" fill="rgba(255,215,0,0.06)"/>
  <circle cx="160" cy="320" r="3" fill="rgba(255,255,255,0.04)"/>
  <circle cx="280" cy="360" r="2.5" fill="rgba(255,215,0,0.05)"/>
  <circle cx="40" cy="360" r="3" fill="rgba(255,140,0,0.04)"/>
  <circle cx="360" cy="40" r="2" fill="rgba(255,255,255,0.05)"/>

  <!-- corner ornament top-left -->
  <g opacity="0.08">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#FFD700" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="60" stroke="#FFD700" stroke-width="1.5"/>
    <line x1="10" y1="10" x2="40" y2="10" stroke="#FFD700" stroke-width="0.8"/>
    <line x1="10" y1="10" x2="10" y2="40" stroke="#FFD700" stroke-width="0.8"/>
  </g>
  <!-- corner ornament top-right -->
  <g opacity="0.08">
    <line x1="400" y1="0" x2="340" y2="0" stroke="#FFD700" stroke-width="1.5"/>
    <line x1="400" y1="0" x2="400" y2="60" stroke="#FFD700" stroke-width="1.5"/>
    <line x1="390" y1="10" x2="360" y2="10" stroke="#FFD700" stroke-width="0.8"/>
    <line x1="390" y1="10" x2="390" y2="40" stroke="#FFD700" stroke-width="0.8"/>
  </g>
  <!-- corner ornament bottom-left -->
  <g opacity="0.08">
    <line x1="0" y1="400" x2="60" y2="400" stroke="#FFD700" stroke-width="1.5"/>
    <line x1="0" y1="400" x2="0" y2="340" stroke="#FFD700" stroke-width="1.5"/>
    <line x1="10" y1="390" x2="40" y2="390" stroke="#FFD700" stroke-width="0.8"/>
    <line x1="10" y1="390" x2="10" y2="360" stroke="#FFD700" stroke-width="0.8"/>
  </g>
  <!-- corner ornament bottom-right -->
  <g opacity="0.08">
    <line x1="400" y1="400" x2="340" y2="400" stroke="#FFD700" stroke-width="1.5"/>
    <line x1="400" y1="400" x2="400" y2="340" stroke="#FFD700" stroke-width="1.5"/>
    <line x1="390" y1="390" x2="360" y2="390" stroke="#FFD700" stroke-width="0.8"/>
    <line x1="390" y1="390" x2="390" y2="360" stroke="#FFD700" stroke-width="0.8"/>
  </g>
</svg>

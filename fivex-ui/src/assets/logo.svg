<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="stoneBlack" x1="30%" y1="20%" x2="70%" y2="80%">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <linearGradient id="stoneWhite" x1="30%" y1="20%" x2="70%" y2="80%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#bbb"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Board grid icon -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="44" height="44" rx="6" fill="#2A1F0E" stroke="#7A5C2E" stroke-width="1.5"/>
    <!-- grid lines -->
    <line x1="11" y1="4" x2="11" y2="40" stroke="#7A5C2E" stroke-width="0.8"/>
    <line x1="22" y1="4" x2="22" y2="40" stroke="#7A5C2E" stroke-width="0.8"/>
    <line x1="33" y1="4" x2="33" y2="40" stroke="#7A5C2E" stroke-width="0.8"/>
    <line x1="4" y1="11" x2="40" y2="11" stroke="#7A5C2E" stroke-width="0.8"/>
    <line x1="4" y1="22" x2="40" y2="22" stroke="#7A5C2E" stroke-width="0.8"/>
    <line x1="4" y1="33" x2="40" y2="33" stroke="#7A5C2E" stroke-width="0.8"/>
    <!-- star points -->
    <circle cx="11" cy="11" r="1.5" fill="#7A5C2E"/>
    <circle cx="33" cy="11" r="1.5" fill="#7A5C2E"/>
    <circle cx="22" cy="22" r="2" fill="#7A5C2E"/>
    <circle cx="11" cy="33" r="1.5" fill="#7A5C2E"/>
    <circle cx="33" cy="33" r="1.5" fill="#7A5C2E"/>
    <!-- stones -->
    <circle cx="11" cy="22" r="5" fill="url(#stoneBlack)" filter="url(#glow)"/>
    <circle cx="22" cy="11" r="5" fill="url(#stoneBlack)"/>
    <circle cx="22" cy="33" r="5" fill="url(#stoneWhite)" stroke="#ccc" stroke-width="0.5"/>
    <circle cx="33" cy="22" r="5" fill="url(#stoneWhite)" stroke="#ccc" stroke-width="0.5"/>
    <!-- winning stone with glow -->
    <circle cx="33" cy="33" r="5.5" fill="url(#stoneBlack)" filter="url(#glow)"/>
    <circle cx="31.5" cy="31.5" r="1.5" fill="rgba(255,255,255,0.3)"/>
  </g>

  <!-- Text: 五子棋 -->
  <text x="64" y="28" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="url(#logoGrad)">五子棋</text>
  <!-- Sub text: FIVEX -->
  <text x="65" y="46" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" font-weight="600" letter-spacing="4" fill="#8B7355">FIVEX</text>

  <!-- Decorative dot separator -->
  <circle cx="148" cy="20" r="2" fill="#FFD700" opacity="0.6"/>
  <circle cx="156" cy="20" r="2" fill="#FFA500" opacity="0.6"/>
  <circle cx="164" cy="20" r="2" fill="#FF6B35" opacity="0.6"/>

  <!-- Tag line -->
  <text x="148" y="46" font-family="'Noto Sans SC', sans-serif" font-size="10" fill="#8B7355" letter-spacing="1">在线对战平台</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2d40"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <linearGradient id="avatarAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="40" cy="40" r="38"/></clipPath>
  </defs>
  <circle cx="40" cy="40" r="39" fill="url(#avatarBg)" stroke="url(#avatarAccent)" stroke-width="2"/>
  <!-- body -->
  <ellipse cx="40" cy="70" rx="22" ry="16" fill="#162030" clip-path="url(#circle)"/>
  <!-- head -->
  <circle cx="40" cy="32" r="14" fill="#2A3A50"/>
  <!-- face highlight -->
  <ellipse cx="35" cy="28" rx="4" ry="3" fill="rgba(255,255,255,0.08)"/>
  <!-- subtle board pattern on chest -->
  <g clip-path="url(#circle)" opacity="0.15">
    <line x1="18" y1="58" x2="62" y2="58" stroke="#FFD700" stroke-width="0.8"/>
    <line x1="18" y1="64" x2="62" y2="64" stroke="#FFD700" stroke-width="0.8"/>
    <line x1="26" y1="54" x2="26" y2="78" stroke="#FFD700" stroke-width="0.8"/>
    <line x1="40" y1="54" x2="40" y2="78" stroke="#FFD700" stroke-width="0.8"/>
    <line x1="54" y1="54" x2="54" y2="78" stroke="#FFD700" stroke-width="0.8"/>
  </g>
  <!-- border ring glow -->
  <circle cx="40" cy="40" r="38" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="goldMain" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#B8860B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- base plate -->
  <rect x="22" y="68" width="36" height="6" rx="3" fill="url(#goldMain)" filter="url(#shadow)"/>
  <!-- stem -->
  <rect x="34" y="56" width="12" height="14" rx="2" fill="url(#goldMain)"/>
  <!-- stem highlight -->
  <rect x="35" y="57" width="4" height="12" rx="1" fill="url(#goldShine)" opacity="0.4"/>

  <!-- cup body -->
  <path d="M18 14 Q16 36 28 50 Q34 56 40 56 Q46 56 52 50 Q64 36 62 14 Z"
        fill="url(#goldMain)" filter="url(#shadow)"/>

  <!-- cup inner shadow -->
  <path d="M22 16 Q21 34 30 47 Q35 53 40 54 Q45 53 50 47 Q59 34 58 16 Z"
        fill="url(#goldShine)" opacity="0.25"/>

  <!-- handles -->
  <path d="M18 16 Q8 16 8 28 Q8 38 18 38" stroke="url(#goldMain)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M62 16 Q72 16 72 28 Q72 38 62 38" stroke="url(#goldMain)" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- star on cup -->
  <g transform="translate(40,33)">
    <polygon points="0,-9 2.1,-2.9 8.6,-2.9 3.4,1.1 5.3,7.3 0,3.5 -5.3,7.3 -3.4,1.1 -8.6,-2.9 -2.1,-2.9"
             fill="#FFF8DC" opacity="0.9"/>
  </g>

  <!-- rim highlight -->
  <ellipse cx="40" cy="14" rx="22" ry="3" fill="rgba(255,255,255,0.3)"/>
</svg>
